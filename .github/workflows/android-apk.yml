name: Build Rozgar Setu MSR Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK & Release AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozgarSetuMSR-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozgarSetuMSR-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
